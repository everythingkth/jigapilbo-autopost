name: publish
on:
  schedule:
    - cron: "*/20 * * * *"     # 예비 시작용 (실제 확인은 loop.sh 안에서 20분마다)
  workflow_dispatch:
    inputs:
      dry_run: {description: "1이면 실제로 올리지 않고 확인만", default: "0"}
      only: {description: "특정 글 ID만 (예: 2026-10-12_P004)", default: ""}
permissions:
  contents: write
  actions: write        # 끝날 때 자기 자신을 다시 실행
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}          # 항상 main 최신본 (예전 커밋으로 돌면 중복 게시 위험)
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests==2.32.3
      - name: publish due posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          ONLY: ${{ github.event.inputs.only || '' }}
          LOOP_MINUTES: "300"
        run: cp publisher/loop.sh "$RUNNER_TEMP/loop.sh" && bash "$RUNNER_TEMP/loop.sh"
      - name: restart
        if: always() && github.event.inputs.dry_run != '1' && github.event.inputs.only == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main -R ${{ github.repository }} || true
