name: publish
on:
  schedule:
    - cron: "*/20 * * * *"     # 20분마다 예약 시각 지난 글 확인
  push:
    branches: [main]
    paths: ["queue/**"]
  workflow_dispatch:
    inputs:
      dry_run: {description: "1이면 실제로 올리지 않고 확인만", default: "0"}
      only: {description: "특정 글 ID만 (예: 2026-10-12_P004)", default: ""}
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests==2.32.3
      - name: publish due posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          ONLY: ${{ github.event.inputs.only || '' }}
        run: python publisher/publish.py
      - name: save results
        if: always()
        run: |
          git config user.name "jigapilbo-bot"
          git config user.email "jigapilbo-bot@users.noreply.github.com"
          git add state/published.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "게시 기록 업데이트" && git pull --rebase && git push)
